spring.datasource.url=jdbc:sqlite:competition.db?busy_timeout=30000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
software.register.server=http://43.143.37.36:10000

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
#software.register.server=http://127.0.0.1:10000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

management.health.defaults.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true


logging.level.root=INFO
logging.level.com.yourcompany=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n

logging.file.name=logs/application.log

logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=logs/application.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.total-size-cap=10GB