name: Package Windows Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: fx-server

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fronted/package-lock.json

      - name: Build frontend
        working-directory: fronted
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }

      - name: Copy frontend into Java resources
        run: |
          $ErrorActionPreference = 'Stop'
          $source = '../fronted/dist'
          $destination = 'src/main/resources/frontend'
          if (-not (Test-Path "$source/index.html")) {
            throw 'Frontend dist/index.html was not generated'
          }
          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-ChildItem -LiteralPath $source -Force | Copy-Item -Destination $destination -Recurse -Force

      - name: Set up Java 17 x64
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: maven
          cache-dependency-path: fx-server/pom.xml

      - name: Build Spring Boot JAR
        run: |
          mvn --batch-mode --no-transfer-progress clean package -DskipTests
          if ($LASTEXITCODE -ne 0) { throw 'Maven build failed' }
          $entries = & "$env:JAVA_HOME/bin/jar.exe" tf 'target/fx-server-1.0-SNAPSHOT.jar'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect packaged JAR' }
          if ($entries -notcontains 'BOOT-INF/classes/frontend/index.html') {
            throw 'Frontend index.html is missing from the packaged JAR'
          }

      - name: Prepare application files
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'target/jpackage-input' -Force | Out-Null
          Copy-Item 'target/fx-server-1.0-SNAPSHOT.jar' 'target/jpackage-input/'
          Copy-Item 'competition.db' 'target/jpackage-input/'
          Copy-Item '资源' 'target/jpackage-input/' -Recurse
          # Keep native jpackage command arguments ASCII on Windows JDK 17.
          Copy-Item -LiteralPath '资源/素材/图标.ico' -Destination 'target/app.ico'

      - name: Package portable application with icon
        run: |
          $packageArgs = @(
            '--type', 'app-image',
            '--name', 'FxServer',
            '--app-version', '1.0.0',
            '--icon', 'target/app.ico',
            '--input', 'target/jpackage-input',
            '--main-jar', 'fx-server-1.0-SNAPSHOT.jar',
            '--main-class', 'org.springframework.boot.loader.JarLauncher',
            '--add-modules', 'ALL-MODULE-PATH',
            '--java-options', '-Dfile.encoding=UTF-8',
            '--java-options', '-Duser.dir=$APPDIR',
            '--dest', 'target/windows'
          )
          & "$env:JAVA_HOME/bin/jpackage.exe" @packageArgs
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
          if (-not (Test-Path 'target/windows/FxServer/FxServer.exe')) {
            throw 'Application EXE was not generated'
          }

      - name: Create ZIP
        run: |
          Compress-Archive -Path 'target/windows/FxServer' -DestinationPath 'target/FxServer-windows-x64.zip'

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: FxServer-windows-x64
          path: fx-server/target/FxServer-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
